<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TUTORÍA</title>
    <link rel="stylesheet" href="public/css/nav.css" />
    <link rel="stylesheet" href="public/css/dialog.css" />
    <script src="public/js/iniciarSesion.js" defer></script>
  </head>

  <body>
    <nav class="navbar" aria-label="Navegación principal">
      <div class="logo">
        <img
          src="public/img/ini_sesion.png"
          id="iniciarSesion"
          width="30px"
          height="33px"
        />
      </div>

      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="ayuda.html">Ayuda</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>

      <button class="menu-btn" aria-label="Abrir menú">☰</button>
    </nav>

    <dialog id="miModal">
      <!-- Botón de cerrar (X) en la esquina superior derecha -->
      <form method="dialog">
        <button class="btn-cerrar-x" aria-label="Cerrar modal">×</button>
      </form>

      <h2>Iniciar Sesión</h2>
      <p class="modal-subtitulo">
        Introduce tus credenciales para acceder a tu cuenta.
      </p>

      <!-- Formulario de Inicio de Sesión -->
      <form class="formulario-login" id="loginForm">
        <div class="grupo-input">
          <label for="usuario">Usuario</label>
          <input
            type="text"
            id="usuario"
            placeholder="Nombre de usuario"
            required
            autocomplete="username"
          />
        </div>

        <div class="grupo-input">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          />
        </div>

        <button type="submit" class="btn-enviar">Entrar</button>
      </form>
    </dialog>

    <!-- FOOTER BÁSICO -->
    <footer class="footer">
      <p>&copy; 2026 TUTORÍAS. Todos los derechos reservados.</p>
      <div class="footer-links">
        <a href="ayuda.html">Ayuda</a>
        <a href="contacto.html">Contacto</a>
      </div>
    </footer>
  </body>
</html>
